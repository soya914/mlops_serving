<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="모델 선택 결과">
  <title>모델 선택 결과 — logistic_regression 선택, 홀드아웃 0.9333</title>
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="lose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#40395e"/><stop offset="100%" stop-color="#524a75"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="560" rx="18" fill="#0d1117" stroke="#2a2145" stroke-width="1.5"/>
  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Malgun Gothic,Apple SD Gothic Neo,sans-serif">
    <text x="44" y="62" font-size="28" font-weight="700" fill="#f0f6fc">모델 선택 결과</text>
    <text x="44" y="94" font-size="16" fill="#9aa3b2">후보 3개를 5-fold 교차검증으로 비교 · 학습 120건 / 홀드아웃 30건</text>
    <text x="44" y="140" font-size="13" font-weight="600" fill="#9aa3b2" letter-spacing="1">교차검증 정확도 (CV)</text>
    <line x1="430.0" y1="156" x2="430.0" y2="340" stroke="#2c2545" stroke-width="1" stroke-dasharray="3 5"/>
    <text x="430.0" y="380" font-size="13" fill="#9aa3b2" text-anchor="middle">0.0</text>
    <line x1="705.0" y1="156" x2="705.0" y2="340" stroke="#2c2545" stroke-width="1" stroke-dasharray="3 5"/>
    <text x="705.0" y="380" font-size="13" fill="#9aa3b2" text-anchor="middle">0.5</text>
    <line x1="980.0" y1="156" x2="980.0" y2="340" stroke="#2c2545" stroke-width="1" stroke-dasharray="3 5"/>
    <text x="980.0" y="380" font-size="13" fill="#9aa3b2" text-anchor="middle">1.0</text>
    <text x="412" y="194" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#f0f6fc" text-anchor="end">logistic_regression</text>
    <rect x="430" y="168" width="550" height="40" rx="8" fill="#1b1730"/>
    <rect x="430" y="168" width="527.1" height="40" rx="8" fill="url(#win)"/>
    <text x="943.1" y="194" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">0.9583</text>
    <text x="973.1" y="194" font-size="15" font-weight="700" fill="#a855f7">선택됨</text>
    <text x="412" y="256" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9aa3b2" text-anchor="end">random_forest_100</text>
    <rect x="430" y="230" width="550" height="40" rx="8" fill="#1b1730"/>
    <rect x="430" y="230" width="522.5" height="40" rx="8" fill="url(#lose)"/>
    <text x="938.5" y="256" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">0.9500</text>
    <text x="412" y="318" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9aa3b2" text-anchor="end">random_forest_300_depth3</text>
    <rect x="430" y="292" width="550" height="40" rx="8" fill="#1b1730"/>
    <rect x="430" y="292" width="522.5" height="40" rx="8" fill="url(#lose)"/>
    <text x="938.5" y="318" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">0.9500</text>
    <text x="44" y="410" font-size="14" fill="#9aa3b2">1위와 2위 차이는 0.0083 — 축을 0 부터 그렸으므로 막대 길이 차이는 거의 안 보인다. 그래서 홀드아웃으로 한 번 더 확인한다.</text>
    <rect x="44" y="436" width="1012" height="86" rx="12" fill="#161226" stroke="#2a2145"/>
    <text x="72" y="470" font-size="14" font-weight="600" fill="#9aa3b2" letter-spacing="1">홀드아웃 (학습·선택에 쓰지 않은 30건)</text>
    <text x="72" y="504" font-size="30" font-weight="800" fill="#22c55e">0.9333</text>
    <text x="190" y="504" font-size="16" fill="#9aa3b2">30건 중 28건 정답 · 게이트 0.90 통과</text>
    <text x="700" y="470" font-size="14" font-weight="600" fill="#9aa3b2" letter-spacing="1">CV 게이트</text>
    <text x="700" y="504" font-size="30" font-weight="800" fill="#22c55e">0.9583</text>
    <text x="810" y="504" font-size="16" fill="#9aa3b2">기준 0.93 통과</text>
  </g>
</svg>
