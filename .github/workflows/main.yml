name: Train, Build, Push and Deploy

# 언제 실행할까?
on:
  push:
    branches: [ "main" ]   # main 에 푸시되면 자동 실행
  workflow_dispatch:        # Actions 탭에서 손으로도 돌릴 수 있게

jobs:
  # ------------------------------------------------------------------
  # 1단계 CI — 모델을 학습하고, 테스트를 통과해야만 다음 단계로 간다
  # ------------------------------------------------------------------
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 모델 학습
        run: python train.py

      - name: 테스트 (API 응답 + 정확도 0.95 이상)
        run: python -m pytest -q

      # 방금 학습한 model.joblib 을 다음 job 으로 넘긴다.
      # 이렇게 해야 "학습 → 이미지에 담기" 가 한 파이프라인으로 이어진다.
      - name: 학습된 모델 넘기기
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: model.joblib

  # ------------------------------------------------------------------
  # 2단계 CI — 이미지 2개를 빌드해서 Docker Hub 로 푸시
  # ------------------------------------------------------------------
  build-and-push:
    needs: train-and-test          # 테스트 통과해야 시작
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 학습된 모델 받기 (레포의 model.joblib 을 덮어씀)
        uses: actions/download-artifact@v4
        with:
          name: model
          path: .

      - name: 빌드 캐시 준비
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 주의: 파일명은 대문자 D 의 ./Dockerfile 이다.
      # 리눅스 러너는 대소문자를 구분해서 ./dockerfile 로 적으면 "not found" 로 죽는다.
      - name: 백엔드(FastAPI) 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-classifier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-classifier:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 프론트엔드(Streamlit) 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # CD — GCP VM 에 접속해서 새 이미지로 갈아끼운다
  # ------------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH 로 GCP VM 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            HUB=${{ secrets.DOCKERHUB_USERNAME }}

            # 1. 새 이미지 받기 (이미지가 public 이라 VM 쪽 docker login 은 불필요)
            sudo docker pull $HUB/iris-classifier:latest
            sudo docker pull $HUB/iris-frontend:latest

            # 2. 기존 컨테이너 정리
            #    이름으로 한 번, 포트로 한 번. 3일차에 이름 없이 띄운 컨테이너가
            #    80/8501 을 잡고 있으면 이름만으로는 안 지워지기 때문.
            sudo docker rm -f iris-api iris-front 2>/dev/null || true
            for p in 80 8501; do
              cid=$(sudo docker ps -q --filter "publish=$p")
              if [ -n "$cid" ]; then sudo docker rm -f $cid; fi
            done

            # 3. 새 컨테이너 실행
            sudo docker run -d --name iris-api --restart unless-stopped \
              -p 80:8000 $HUB/iris-classifier:latest

            #    프론트는 같은 VM 안의 백엔드를 도커 브리지 게이트웨이로 부른다.
            #    외부 IP 를 안 쓰므로 VM 재시작으로 IP 가 바뀌어도 안 깨진다.
            sudo docker run -d --name iris-front --restart unless-stopped \
              -p 8501:8501 -e API_URL=http://172.17.0.1/predict \
              $HUB/iris-frontend:latest

            # 4. 안 쓰는 이미지 정리 (e2-micro 는 디스크가 빠듯하다)
            sudo docker image prune -f

      # 배포가 "성공"이라고 말하려면 실제로 응답이 와야 한다.
      - name: 배포 확인 (health check)
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "http://${{ secrets.GCP_VM_HOST }}/health" | grep -q ok; then
              echo "✅ 서비스 정상"
              curl -fsS -X POST "http://${{ secrets.GCP_VM_HOST }}/predict" \
                -H "Content-Type: application/json" \
                -d '{"data":[5.1,3.5,1.4,0.2]}'
              exit 0
            fi
            echo "기다리는 중... ($i/20)"
            sleep 3
          done
          echo "❌ 60초 안에 health 응답이 없음 — 배포 실패로 처리"
          exit 1
