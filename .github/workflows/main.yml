name: Train, Build, Push and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:        # Actions 탭에서 손으로도 실행 가능

# 배포가 겹치면 컨테이너 교체 도중에 또 교체가 들어온다.
# 취소하지 않고 줄을 세운다 (cancel-in-progress 를 켜면 배포가 중간에 끊길 수 있다).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read            # 최소 권한

env:
  BACKEND_IMAGE: iris-classifier
  FRONTEND_IMAGE: iris-frontend
  PYTHON_VERSION: "3.13"

jobs:
  # ==================================================================
  # 1단계 CI — 학습하고, 게이트를 통과해야만 다음으로 넘어간다
  # ==================================================================
  train-and-test:
    name: 학습 & 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt -r requirements-dev.txt

      # 후보 모델을 교차검증으로 비교해 가장 좋은 것만 저장한다.
      # 홀드아웃 20% 는 학습에도 모델 선택에도 쓰지 않는다.
      - name: 모델 학습 & 선택
        run: python train.py

      # 응답 계약 + 입력 검증 + 성능 게이트(홀드아웃 기준)
      - name: 테스트
        run: python -m pytest -q

      - name: 학습 결과를 실행 페이지에 요약
        if: always()
        run: |
          if [ ! -f metrics.json ]; then
            echo "학습이 실패해 metrics.json 이 없습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## 🧠 학습 결과"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 선택된 모델 | \`$(jq -r .best_model metrics.json)\` |"
            echo "| 교차검증 정확도 (5-fold) | $(jq -r .cv_accuracy metrics.json) |"
            echo "| **홀드아웃 정확도** | **$(jq -r .holdout_accuracy metrics.json)** |"
            echo "| 학습 / 홀드아웃 | $(jq -r .n_train metrics.json)건 / $(jq -r .n_holdout metrics.json)건 |"
            echo "| scikit-learn | $(jq -r .sklearn_version metrics.json) |"
            echo ""
            echo "### 후보 비교"
            echo ""
            echo "| 모델 | CV 정확도 |"
            echo "|---|---|"
            jq -r '.cv_accuracy_all_candidates | to_entries[] | "| `\(.key)` | \(.value) |"' metrics.json
          } >> "$GITHUB_STEP_SUMMARY"

      # 학습 산출물을 다음 job 으로 넘긴다.
      # 이래야 "테스트를 통과한 그 모델" 이 그대로 이미지에 들어간다.
      - name: 학습 산출물 넘기기
        uses: actions/upload-artifact@v7
        with:
          name: model
          path: |
            model.joblib
            metrics.json
          if-no-files-found: error
          retention-days: 7

  # ==================================================================
  # 2단계 CI — 이미지 2개를 빌드해 Docker Hub 로 푸시
  # ==================================================================
  build-and-push:
    name: 이미지 빌드 & 푸시
    needs: train-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: 학습 산출물 받기 (레포의 것을 덮어씀)
        uses: actions/download-artifact@v8
        with:
          name: model
          path: .

      - name: 받은 모델이 방금 학습한 것인지 확인
        run: |
          test -s model.joblib || { echo "model.joblib 이 비어 있음"; exit 1; }
          test -s metrics.json || { echo "metrics.json 이 비어 있음"; exit 1; }
          echo "이미지에 담길 모델: $(jq -r .best_model metrics.json) / 홀드아웃 $(jq -r .holdout_accuracy metrics.json)"

      - name: 빌드 캐시 준비
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 파일명은 대문자 D 의 ./Dockerfile 이다.
      # 리눅스 러너는 대소문자를 구분해서 ./dockerfile 로 적으면 not found 로 죽는다.
      - name: 백엔드(FastAPI) 빌드 & 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 프론트엔드(Streamlit) 빌드 & 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: 푸시된 태그 요약
        run: |
          {
            echo "## 🐳 푸시된 이미지"
            echo ""
            echo "| 이미지 | 태그 |"
            echo "|---|---|"
            echo "| \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}\` | \`latest\`, \`${GITHUB_SHA:0:12}\` |"
            echo "| \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}\` | \`latest\`, \`${GITHUB_SHA:0:12}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==================================================================
  # CD — GCP VM 의 컨테이너를 새 이미지로 교체
  # ==================================================================
  deploy:
    name: GCP VM 배포
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH 로 배포
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            HUB=${{ secrets.DOCKERHUB_USERNAME }}
            SHA=${{ github.sha }}

            # 1. 새 이미지 받기
            #    이미지가 public 이라 VM 쪽 docker login 은 하지 않는다.
            #    (private 으로 바꾸면 여기서 로그인이 필요해진다)
            sudo docker pull "$HUB/iris-classifier:$SHA"
            sudo docker pull "$HUB/iris-frontend:$SHA"

            # 2. 기존 컨테이너 정리 — 이름으로 한 번, 포트로 한 번.
            #    3일차에 --name 없이 띄운 컨테이너는 이름으로는 안 지워지고
            #    포트만 물고 있어서 새 컨테이너가 port is already allocated 로 죽는다.
            sudo docker rm -f iris-api iris-front 2>/dev/null || true
            for p in 80 8501; do
              cid=$(sudo docker ps -q --filter "publish=$p")
              if [ -n "$cid" ]; then
                echo "포트 $p 를 물고 있던 컨테이너 제거: $cid"
                sudo docker rm -f $cid
              fi
            done

            # 3. 커밋 해시 태그로 실행 — latest 는 "언제 받은 latest 인지" 를 알 수 없다.
            sudo docker run -d --name iris-api --restart unless-stopped \
              -p 80:8000 "$HUB/iris-classifier:$SHA"

            #    프론트는 백엔드를 도커 브리지 게이트웨이로 부른다.
            #    외부 IP 를 거치지 않으므로 VM 재시작으로 IP 가 바뀌어도 안 깨진다.
            sudo docker run -d --name iris-front --restart unless-stopped \
              -p 8501:8501 -e API_URL=http://172.17.0.1/predict \
              "$HUB/iris-frontend:$SHA"

            # 4. VM 안에서 먼저 확인 — 여기서 죽으면 외부 확인까지 갈 필요가 없다
            for i in $(seq 1 15); do
              if sudo docker exec iris-api python -c "import urllib.request,sys; sys.exit(0 if b'ok' in urllib.request.urlopen('http://127.0.0.1:8000/health').read() else 1)" 2>/dev/null; then
                echo "컨테이너 내부 health 정상"
                break
              fi
              if [ "$i" = "15" ]; then
                echo "컨테이너가 뜨지 않았습니다. 로그:"
                sudo docker logs --tail 50 iris-api
                exit 1
              fi
              sleep 2
            done

            # 5. e2-micro 는 디스크가 빠듯하다. 안 쓰는 이미지 정리.
            sudo docker image prune -f

      # 배포를 "성공" 이라 부르려면 밖에서도 응답이 와야 한다.
      - name: 외부에서 배포 검증
        run: |
          HOST="${{ secrets.GCP_VM_HOST }}"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "http://$HOST/health" | grep -q ok; then
              echo "health 통과"
              INFO=$(curl -fsS --max-time 5 "http://$HOST/model-info")
              PRED=$(curl -fsS --max-time 5 -X POST "http://$HOST/predict" \
                     -H "Content-Type: application/json" \
                     -d '{"data":[5.1,3.5,1.4,0.2]}')
              echo "$PRED" | grep -q setosa || { echo "예측 결과가 예상과 다릅니다: $PRED"; exit 1; }
              {
                echo "## ✅ 배포 완료"
                echo ""
                echo "| 확인 | 결과 |"
                echo "|---|---|"
                echo "| \`GET /health\` | ok |"
                echo "| \`POST /predict\` | \`$PRED\` |"
                echo "| \`GET /model-info\` | \`$INFO\` |"
                echo ""
                echo "실행 중인 이미지 태그: \`${GITHUB_SHA:0:12}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "대기 중... ($i/20)"
            sleep 3
          done
          {
            echo "## ❌ 배포 검증 실패"
            echo ""
            echo "60초 안에 \`/health\` 응답이 없었습니다. 확인할 것:"
            echo "- VM 이 실행 중인가"
            echo "- \`GCP_VM_HOST\` 가 현재 외부 IP 와 같은가 (VM 재시작 시 바뀜)"
            echo "- 방화벽 tcp:80 규칙이 살아 있는가"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
